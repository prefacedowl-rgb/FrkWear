        .glitch-text {

        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        .glitch-text::before {
            left: -3px;
            text-shadow: 2px 0 #FF2D78;
            animation: glitch-anim 2s infinite linear alternate-reverse;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
        }

        .glitch-text::after {
            left: 3px;
            text-shadow: -2px 0 #C8FF00;
            animation: glitch-anim 3s infinite linear alternate-reverse;
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);

<script>
        // Occasional intense glitch effect
        setInterval(() => {
            const glitchTexts = document.querySelectorAll('.glitch-text');
            glitchTexts.forEach(el => {
                const originalText = el.getAttribute('data-text');
                const glitchedText = originalText.split('').map(char => {
                    return Math.random() > 0.8 ? ['#','@','!','*','%','&'][Math.floor(Math.random()*6)] : char;
                }).join('');
                
                el.innerText = glitchedText;
                
                setTimeout(() => {
                    el.innerText = originalText;
                }, 100);
            });
        }, 3000);
